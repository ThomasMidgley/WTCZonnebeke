{% with club=settings.core.Clubgegevens %}
{% if club.facebook_url or club.strava_url %}
<section class="social" aria-labelledby="social-title">
  <div class="wrap">
    <h2 id="social-title">Volg ons</h2>
    <ul>
      {% if club.facebook_url %}
        <li><a href="{{ club.facebook_url }}" rel="noopener">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
          <span>Facebook</span></a></li>
      {% endif %}
      {% if club.strava_url %}
        <li><a href="{{ club.strava_url }}" rel="noopener">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M15.387 17.944l-2.089-4.116h-3.065L15.387 24l5.15-10.172h-3.066m-7.008-5.599l2.836 5.598h4.172L10.463 0l-7 13.828h4.169"/></svg>
          <span>Strava</span></a></li>
      {% endif %}
    </ul>
  </div>
</section>
{% endif %}
{% endwith %}
