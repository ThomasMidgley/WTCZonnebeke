{% load wagtailimages_tags %}{% if value.image %}<figure>
  {% image value.image width-1200 format-webp as img %}
  <img src="{{ img.url }}" width="{{ img.width }}" height="{{ img.height }}" alt="{% if value.caption %}{{ value.caption }}{% else %}{{ value.image.title }}{% endif %}" loading="lazy">
  {% if value.caption %}<figcaption>{{ value.caption }}</figcaption>{% endif %}
</figure>{% endif %}
